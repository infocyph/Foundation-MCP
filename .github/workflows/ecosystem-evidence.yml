name: "Infbyte Ecosystem Evidence"

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem:
    name: "Infbyte require-dev and zero footprint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: git clone --depth=1 https://github.com/infocyph/Infbyte.git "$RUNNER_TEMP/infbyte"
      - run: php .github/scripts/prepare-infbyte.php "$RUNNER_TEMP/infbyte" "$GITHUB_WORKSPACE"
      - run: composer --working-dir="$RUNNER_TEMP/infbyte" update --no-interaction --prefer-stable --with-all-dependencies
      - run: FOUNDATION_MCP_ECOSYSTEM_ROOT="$RUNNER_TEMP/infbyte" vendor/bin/pest tests/Ecosystem/InfbyteContractTest.php
      - run: "$RUNNER_TEMP/infbyte/vendor/bin/foundation-mcp" doctor --root="$RUNNER_TEMP/infbyte" --no-git
      - run: rm -rf "$RUNNER_TEMP/infbyte/vendor"
      - run: composer --working-dir="$RUNNER_TEMP/infbyte" install --no-dev --no-interaction --prefer-dist
      - run: test ! -e "$RUNNER_TEMP/infbyte/vendor/bin/foundation-mcp"
      - run: test ! -d "$RUNNER_TEMP/infbyte/vendor/infocyph/foundation-mcp"
      - run: test ! -d "$RUNNER_TEMP/infbyte/vendor/infocyph/phpforge"
