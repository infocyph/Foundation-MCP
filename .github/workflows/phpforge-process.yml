name: "One-time PHPForge Process"

on:
  push:
    branches:
      - "feature/foundation-mcp-1.0"

permissions:
  contents: write

jobs:
  process:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          extensions: fileinfo
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: php .github/scripts/update-phpforge-contract.php
      - run: composer ic:process
      - name: Commit processed repository
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No PHPForge processing changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply PHPForge release processing"
          git push origin HEAD:feature/foundation-mcp-1.0
